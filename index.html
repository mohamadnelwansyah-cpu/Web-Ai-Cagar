  <style>
    :root {
      --o1: #F47521;
      --o2: #FF9A3C;
      --od: #D9600F;
      --o-soft: #FFF4EA;
      --o-line: #FFD9B8;
      --ink: #1e293b;
      --muted: #64748b;
      --wa: #16a34a;
    }

    * {
      box-sizing: border-box;
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 154, 60, 0.30), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(244, 117, 33, 0.22), transparent 45%),
        #FFF1E6;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(244, 117, 33, 0.22);
    }

    @media (min-width: 520px) {
      .chat-container {
        height: min(100dvh - 40px, 860px);
        border-radius: 26px;
      }
    }

    /* ---------- HEADER ---------- */
    .header {
      position: relative;
      background: linear-gradient(135deg, var(--od), var(--o1));
      color: #fff;
      padding: calc(12px + env(safe-area-inset-top)) 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
      overflow: hidden;
    }

    .header::before {
      content: "";
      position: absolute;
      right: -40px;
      top: -50px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
    }

    .header::after {
      content: "";
      position: absolute;
      right: 50px;
      bottom: -70px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .avatar {
      width: 46px;
      height: 46px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
    }

    .avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .header-info { flex: 1; min-width: 0; position: relative; z-index: 1; }

    .header-info h1 {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .verified {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .status-online {
      margin: 3px 0 0;
      font-size: 11px;
      opacity: 0.95;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-online {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
      70% { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    .wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 14px;
      width: 100%;
      display: block;
      z-index: 2;
    }

    /* ---------- QUICK CHIPS (geser samping) ---------- */
    .quick-replies {
      padding: 4px 12px 10px;
      background: #fff;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
      border-bottom: 1px solid #FFE9D6;
    }
    .quick-replies::-webkit-scrollbar { display: none; }

    .chip {
      appearance: none;
      -webkit-appearance: none;
      background: var(--o-soft);
      color: var(--od);
      border: 1px solid var(--o-line);
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: transform 0.12s, background 0.2s;
    }

    .chip.instan {
      background: linear-gradient(135deg, var(--od), var(--o1));
      color: #fff;
      border-color: var(--od);
    }

    .chip:active { transform: scale(0.95); }

    /* ---------- MESSAGES ---------- */
    .messages {
      flex: 1;
      padding: 14px 12px 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #FFF9F3;
      scroll-behavior: smooth;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      animation: masuk 0.28s ease-out both;
    }
    .row.user { justify-content: flex-end; }

    @keyframes masuk {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mini-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--o-line);
      padding: 5px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(244, 117, 33, 0.15);
    }
    .mini-avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .msg {
      max-width: 84%;
      padding: 10px 14px 6px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .msg .txt { white-space: pre-wrap; }

    .msg .time {
      display: block;
      text-align: right;
      font-size: 10px;
      margin-top: 3px;
      opacity: 0.6;
    }

    .bot {
      background: #fff;
      color: var(--ink);
      border-bottom-left-radius: 5px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .user {
      background: linear-gradient(135deg, var(--od), var(--o1));
      color: #fff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 3px 10px rgba(244, 117, 33, 0.25);
    }

    .msg.wide { max-width: 92%; }

    /* ---------- KARTU SAMBUTAN ---------- */
    .welcome {
      background: #fff;
      border: 1px solid var(--o-line);
      border-radius: 20px;
      padding: 18px 14px 14px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(244, 117, 33, 0.10);
      animation: masuk 0.4s ease-out both;
    }

    .welcome .logo-big {
      width: 70px;
      height: 70px;
      margin: 0 auto 8px;
      background: var(--o-soft);
      border-radius: 50%;
      padding: 14px;
      border: 1px solid var(--o-line);
    }
    .welcome .logo-big img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .welcome h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--od);
    }

    .welcome p {
      margin: 4px 0 14px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .menu-card {
      appearance: none;
      -webkit-appearance: none;
      background: var(--o-soft);
      border: 1px solid var(--o-line);
      border-radius: 14px;
      padding: 12px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--ink);
      touch-action: manipulation;
      transition: transform 0.12s, box-shadow 0.2s;
    }

    .menu-card:active { transform: scale(0.96); }
    .menu-card:hover { box-shadow: 0 4px 12px rgba(244, 117, 33, 0.18); }

    .menu-card .ico {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--od), var(--o1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 3px 8px rgba(244, 117, 33, 0.25);
    }

    .menu-card b { font-size: 12.5px; font-weight: 600; }
    .menu-card small { font-size: 10.5px; color: var(--muted); line-height: 1.3; }

    /* ---------- KARTU REKENING (gaya ATM) ---------- */
    .atm {
      margin-top: 10px;
      border-radius: 16px;
      padding: 14px 15px 12px;
      color: #fff;
      background: linear-gradient(135deg, #D9600F 0%, #F47521 50%, #FF9A3C 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(244, 117, 33, 0.35);
    }

    .atm::before {
      content: "";
      position: absolute;
      right: -30px;
      top: -40px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
    }

    .atm::after {
      content: "";
      position: absolute;
      right: 30px;
      bottom: -50px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
    }

    .atm > * { position: relative; z-index: 1; }

    .atm .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      opacity: 0.95;
    }

    .atm .bank { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }

    .atm .chip-ic {
      width: 34px;
      height: 24px;
      border-radius: 5px;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      margin: 12px 0 8px;
    }

    .atm .nomor {
      font-family: "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .atm .an {
      margin-top: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      opacity: 0.95;
    }

    .btn-copy {
      width: 100%;
      margin-top: 11px;
      padding: 9px 10px;
      background: #fff;
      color: var(--od);
      border: none;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .btn-copy:active { transform: scale(0.97); }
    .btn-copy.copied { background: #dcfce7; color: #15803d; }

    /* ---------- TOMBOL WA ---------- */
    .wa-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 11px;
    }

    .wa-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 3px 8px rgba(22, 163, 74, 0.28);
      transition: transform 0.12s;
    }
    .wa-btn:active { transform: scale(0.97); }
    .wa-btn.sekunder { background: linear-gradient(135deg, #15803d, #16a34a); }
    .wa-btn svg { width: 18px; height: 18px; flex-shrink: 0; fill: #fff; }

    /* ---------- PROFIL & LEGALITAS ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0;
    }

    .stat {
      background: linear-gradient(135deg, var(--o-soft), #FFE9D6);
      border: 1px solid var(--o-line);
      border-radius: 12px;
      padding: 9px 4px;
      text-align: center;
    }
    .stat b { display: block; font-size: 18px; font-weight: 800; color: var(--od); line-height: 1.1; }
    .stat span { font-size: 10px; color: var(--muted); }

    .acc {
      border: 1px solid var(--o-line);
      border-radius: 12px;
      margin-top: 7px;
      background: #fff;
      overflow: hidden;
    }

    .acc summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--od);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--o-soft);
    }
    .acc summary::-webkit-details-marker { display: none; }
    .acc summary::after {
      content: "▾";
      margin-left: auto;
      transition: transform 0.2s;
      font-size: 13px;
    }
    .acc[open] summary::after { transform: rotate(180deg); }
    .acc .isi {
      padding: 10px 12px 12px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #334155;
    }

    .legal-note {
      font-size: 12.5px;
      line-height: 1.55;
      color: #334155;
    }


    /* ---------- LAMBANG DONASI BARANG ---------- */
    .menu-card .ico.putih {
      background: #fff;
      border: 1px solid #cfe9d6;
      box-shadow: 0 3px 8px rgba(22, 163, 74, 0.20);
      padding: 6px;
    }
    .menu-card .ico.putih img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .chip-db {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      vertical-align: -4px;
      margin-right: 3px;
      padding: 3px;
    }
    .chip-db img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .sum-ico { width: 20px; height: 20px; object-fit: contain; display: inline-block; vertical-align: middle; }
    .mini-avatar.hijau { border-color: #bbf7d0; box-shadow: 0 1px 4px rgba(22, 163, 74, 0.2); }

    /* ---------- LOGO PROGRAM ---------- */
    .strip-label {
      margin: 16px 0 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .logo-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 6px;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }
    .logo-strip::-webkit-scrollbar { display: none; }

    .logo-tile {
      appearance: none;
      -webkit-appearance: none;
      flex: 0 0 auto;
      width: 132px;
      height: 78px;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid var(--o-line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      touch-action: manipulation;
      transition: transform 0.12s, box-shadow 0.2s;
    }
    .logo-tile.klik { cursor: pointer; }
    .logo-tile.klik:active { transform: scale(0.96); }
    .logo-tile.klik:hover { box-shadow: 0 4px 12px rgba(244, 117, 33, 0.18); }
    .logo-tile img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* geser dengan mouse + penanda masih ada isi di samping */
    .geser { user-select: none; -webkit-user-select: none; }
    @media (hover: hover) {
      .geser { cursor: grab; }
      .geser.drag { cursor: grabbing; scroll-snap-type: none; }
      .geser.drag * { cursor: grabbing; }
    }
    .geser.fade-r {
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent);
      mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent);
    }
    .geser.fade-l {
      -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 34px), transparent);
      mask-image: linear-gradient(to left, #000 calc(100% - 34px), transparent);
    }
    .geser.fade-l.fade-r {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 34px, #000 calc(100% - 34px), transparent);
      mask-image: linear-gradient(to right, transparent, #000 34px, #000 calc(100% - 34px), transparent);
    }


    /* grid logo program (semua terlihat, tanpa geser) */
    .logo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .logo-grid .logo-tile {
      width: auto;
      height: auto;
      flex-direction: column;
      gap: 6px;
      padding: 10px 8px 8px;
    }
    .logo-grid .logo-tile img {
      width: 100%;
      height: 46px;
      max-height: none;
      object-fit: contain;
    }
    .logo-grid .logo-tile.tinggi img { height: 62px; }
    .logo-grid .logo-tile.lebar {
      grid-column: span 2;
      border-color: #bbf7d0;
      background: linear-gradient(135deg, #f7fff9, #ecfdf3);
    }
    .logo-grid .logo-tile.lebar img { height: 52px; mix-blend-mode: multiply; }
    .logo-grid .logo-tile.lebar2 { grid-column: span 2; }
    .logo-tile .cap {
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.3;
      text-align: center;
    }

    .pilar-logo {
      display: block;
      margin: 0 auto 10px;
      max-width: 75%;
      max-height: 56px;
      object-fit: contain;
    }
    .pilar-logo.tinggi { max-height: 96px; }

    .logo-head {
      display: block;
      max-width: 150px;
      max-height: 36px;
      object-fit: contain;
      margin: 0 0 8px;
    }

    /* ---------- TYPING ---------- */
    .dots { display: flex; gap: 4px; padding: 6px 4px 4px; }
    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--o2);
      animation: lompat 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes lompat {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ---------- INPUT ---------- */
    .input-area {
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid #FFE9D6;
      display: flex;
      gap: 9px;
      align-items: center;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      border: 1.5px solid var(--o-line);
      background: var(--o-soft);
      border-radius: 26px;
      outline: none;
      font-size: 16px;
      color: var(--ink);
      transition: border-color 0.2s, background 0.2s;
    }

    .input-area input:focus { border-color: var(--od); background: #fff; }

    .input-area button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--od), var(--o1));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(244, 117, 33, 0.35);
      flex-shrink: 0;
      transition: transform 0.12s;
    }
    .input-area button:active { transform: scale(0.92); }
    .input-area button svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }
    .input-area button:disabled { background: #cbd5e1; box-shadow: none; }

    /* ---------- TOAST ---------- */
    .toast {
      position: absolute;
      left: 50%;
      bottom: 86px;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: #fff;
      padding: 9px 16px;
      border-radius: 22px;
      font-size: 12.5px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 50;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

  /* ---------- GESER DENGAN MOUSE ---------- */
  function aktifkanGeser(el, pakaiWheel) {
    let down = false, sx = 0, sl = 0, moved = false;

    el.addEventListener("pointerdown", function(e) {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      down = true; moved = false; sx = e.clientX; sl = el.scrollLeft;
    });
    window.addEventListener("pointermove", function(e) {
      if (!down) return;
      const dx = e.clientX - sx;
      if (Math.abs(dx) > 5) { moved = true; el.classList.add("drag"); }
      if (moved) el.scrollLeft = sl - dx;
    });
    window.addEventListener("pointerup", function() {
      if (!down) return;
      down = false;
      el.classList.remove("drag");
      setTimeout(function() { moved = false; }, 0);
    });
    // klik setelah menggeser jangan dianggap menekan tombol
    el.addEventListener("click", function(e) {
      if (moved) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    if (pakaiWheel) {
      el.addEventListener("wheel", function(e) {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          el.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });
    }

    function upd() {
      el.classList.toggle("fade-r", el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
      el.classList.toggle("fade-l", el.scrollLeft > 4);
    }
    el.addEventListener("scroll", upd);
    window.addEventListener("resize", upd);
    setTimeout(upd, 60);
  }

  /* ---------- KIRIM KE SERVER ---------- */
  async function prosesKirim(pesan) {
    const input = document.getElementById("userInput");
    const btn = document.getElementById("sendBtn");

    tambahBubble(pesan, "user");

    // salam saja: dijawab langsung tanpa menunggu server
    if (apakahSalamSaja(pesan)) {
      tampilTyping();
      setTimeout(function() {
        hapusTyping();
        const bal = "Wa'alaikumussalam warahmatullahi wabarakatuh 🙏\n\nSenang bertemu Kakak di layanan **Sahabat Donatur CAGAR**. Boleh kami tahu nama panggilan Kakak? Atau langsung pilih menu di atas untuk rekening, donasi barang, atau info program ya.";
        tambahBubble(bal, "bot");
        daftarRiwayat.push("Donatur: " + pesan + "\nAI: " + bal);
      }, 600);
      return;
    }

    btn.disabled = true;
    tampilTyping();

    const riwayatSingkat = daftarRiwayat.slice(-4).join("\n");
    const topikDonasiBarang = /donasi barang|sumbang barang|barang bekas|pakaian layak|jemput barang|gudang donasi/i.test(pesan);

    const pengendali = new AbortController();
    const pewaktu = setTimeout(function() { pengendali.abort(); }, WAKTU_TUNGGU_MS);

    try {
      const response = await fetch(URL_APPS_SCRIPT, {
        method: "POST",
        redirect: "follow",
        signal: pengendali.signal,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          nama: "Calon Donatur",
          noWa: "-",
          pesan: pesan,
          riwayat: riwayatSingkat
        })
      });

      clearTimeout(pewaktu);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const hasil = JSON.parse(await response.text());
      const balasan = hasil.balasan || "Silakan hubungi Admin kami langsung melalui tombol WhatsApp di bawah ini:";

      const isDonasiBarang = topikDonasiBarang || /donasi barang|sibara|33x22x18|jalur 1|jalur 2|jalur 3/i.test(balasan);
      const sebutRekening = /rekening|bank|transfer|1560/i.test(balasan);
      const butuhTombolAdmin = /rekening|transfer|konfirmasi|antrean|sibuk|admin|irna|hafifah|mandiri/i.test(balasan);

      let modeTombol = "none";
      let pesanWA = "";
      if (isDonasiBarang) {
        modeTombol = "donasi_barang";
        pesanWA = "Halo SIBara Asisten, saya dari web Sahabat CAGAR ingin donasi barang: " + pesan;
      } else if (butuhTombolAdmin) {
        modeTombol = "admin";
        pesanWA = "Assalamu'alaikum Admin CAGAR, saya baru saja berdiskusi di web Sahabat Donatur mengenai: " + pesan;
      }

      hapusTyping();
      tambahBubble(balasan, "bot", modeTombol, pesanWA, sebutRekening);
      daftarRiwayat.push("Donatur: " + pesan + "\nAI: " + balasan);

    } catch (err) {
      clearTimeout(pewaktu);
      console.error("Sahabat Donatur: gagal menghubungi server", err);
      hapusTyping();
      if (topikDonasiBarang) {
        tambahBubble(TEKS_DONASI_BARANG, "bot", "donasi_barang", "Halo SIBara Asisten, saya mau donasi barang via Sahabat CAGAR: " + pesan, false);
      } else {
        tambahBubble("Koneksi sedang padat Kak. Agar tidak menunggu lama, silakan klik salah satu tombol Admin di bawah untuk langsung terhubung via WhatsApp:", "bot", "admin", "Assalamu'alaikum Admin CAGAR, saya ingin bertanya tentang donasi CAGAR Foundation.", false);
      }
    } finally {
      hapusTyping();
      btn.disabled = false;
      input.focus();
    }
  }

  /* ---------- BUBBLE ---------- */
  function tambahBubble(teks, pengirim, modeTombol, pesanWA, tampilkanKartuRek) {
    const box = document.getElementById("chatBox");
    const r = buatRow(pengirim, pengirim === "bot" && (tampilkanKartuRek || modeTombol === "admin" || modeTombol === "donasi_barang"), (pengirim === "bot" && modeTombol === "donasi_barang") ? LOGO_DBI : null);
    const bubble = r.bubble;

    const teksBersih = teks.replace(/\[META\|[\s\S]*$/g, "").trim();
    if (pengirim === "bot" && modeTombol === "donasi_barang") {
      const lg = document.createElement("img");
      lg.className = "logo-head";
      lg.src = LOGO_DB;
      lg.alt = "Logo Donasi Barang";
      bubble.appendChild(lg);
    }

    const txt = document.createElement("div");
    txt.className = "txt";
    txt.innerHTML = rapikanTeks(teksBersih);
    bubble.appendChild(txt);

    if (tampilkanKartuRek) bubble.appendChild(buatKartuRek());

    if (modeTombol === "donasi_barang") {
      bubble.appendChild(tombolDonasiBarang(pesanWA));
    } else if (modeTombol === "admin") {
      bubble.appendChild(tombolAdmin(pesanWA));
    }

    tambahJam(bubble);
    box.appendChild(r.row);
    scrollBawah();
  }

  aktifkanGeser(document.getElementById("chipRow"), true);
  tampilSambutan();
</script>
